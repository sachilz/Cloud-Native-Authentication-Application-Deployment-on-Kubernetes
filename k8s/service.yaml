apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: devops-tracker
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: devops-tracker
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: http
      nodePort: 30080
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: devops-tracker
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP


apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-task-tracker-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: devops-task-tracker-backend
  template:
    metadata:
      labels:
        app: devops-task-tracker-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - containerPort: 5000

          envFrom:
            - configMapRef:
                name: devops-task-tracker-backend-config

          env:
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: devops-task-tracker-postgres-secret
                  key: POSTGRES_DB
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: devops-task-tracker-postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: devops-task-tracker-postgres-secret
                  key: POSTGRES_PASSWORD

          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}

          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /api/health/live
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3

---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app: devops-task-tracker-backend
  ports:
    - port: 5000
      targetPort: 5000
  type: ClusterIP


# Default values for devops-task-tracker

# General settings
replicaCount: 1

image:
  repository: nginx
  pullPolicy: IfNotPresent
  tag: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Service account
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""

# Pod settings
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}

# Default service
service:
  type: ClusterIP
  port: 80

# Ingress settings
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

# HTTP Route settings
httpRoute:
  enabled: false
  annotations: {}
  parentRefs:
    - name: gateway
      sectionName: http
  hostnames:
    - chart-example.local
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /headers

# Default resources and probes
resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http

readinessProbe:
  httpGet:
    path: /
    port: http

# Autoscaling
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

# Additional volumes
volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# ======================================
# BACKEND CONFIGURATION
# ======================================
backend:
  replicaCount: 1

  image:
    repository: app-backend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    port: 5000

  config:
    NODE_ENV: production
    DB_HOST: devops-task-tracker-postgres
    DB_PORT: "5432"

  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# ======================================
# FRONTEND CONFIGURATION
# ======================================
frontend:
  replicaCount: 1

  image:
    repository: app-frontend
    tag: latest
    pullPolicy: IfNotPresent

  service:
    type: NodePort
    port: 80
    targetPort: 80

# ======================================
# POSTGRESQL CONFIGURATION
# ======================================
postgres:
  image:
    repository: postgres
    tag: "16-alpine"
    pullPolicy: IfNotPresent

  service:
    port: 5432

  persistence:
    enabled: true
    accessMode: ReadWriteOnce
    size: 1Gi

  auth:
    username: postgres
    database: devops_tasks

    # Use an existing Kubernetes Secret for deployment.
    # Leave empty for now during local chart development.
    existingSecret: ""

    # Do not commit real passwords here.
    # Supply password securely during deployment.
    password: ""

services:
  # 1. Database
  postgres:
    image: postgres:16-alpine
    container_name: devops-postgres
    environment:
      POSTGRES_DB: devops_tasks
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/src/db/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql
      - ./backend/src/db/seeds/001_seed_tasks.sql:/docker-entrypoint-initdb.d/02_seed.sql

  # 2. Node.js Backend API
  backend:
    build: ./backend
    container_name: devops-backend
    ports:
      - "5001:5000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: devops_tasks
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - postgres

  # 3. React Frontend Web App
  frontend:
    build: ./frontend
    container_name: devops-frontend
    ports:
      - "3000:80"
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
